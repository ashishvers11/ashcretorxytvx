<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="noirBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="70%" stop-color="#09050d"/>
      <stop offset="100%" stop-color="#1c0b16"/>
    </linearGradient>
    <linearGradient id="amberLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#noirBg)"/>

  <!-- Chiaroscuro Dramatic Light Beam -->
  <polygon points="320,0 390,0 220,240 70,240" fill="url(#amberLight)"/>

  <!-- Dust Motes floating in light beam -->
  <g fill="#fef3c7" opacity="0.6">
    <circle cx="280" cy="50" r="1.5"/>
    <circle cx="230" cy="90" r="2"/>
    <circle cx="260" cy="130" r="1"/>
    <circle cx="180" cy="150" r="2.5"/>
    <circle cx="150" cy="190" r="1.2"/>
  </g>

  <!-- Dark Silhouette of Investigator / Detective -->
  <g transform="translate(140, 60)" fill="#020617" stroke="#000000" stroke-width="2">
    <!-- Fedora/hood brim & head -->
    <path d="M 15 35 Q 35 15 55 35 Q 70 38 75 42 Q 40 40 10 42 Z"/>
    <ellipse cx="42" cy="52" rx="16" ry="18"/>
    <!-- Coat / Shoulders -->
    <path d="M 10 70 Q 42 62 74 70 L 95 180 L -15 180 Z"/>
    <!-- Amber Rim Highlight on Detective Collar -->
    <path d="M 50 68 L 74 70 L 85 110" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.85"/>
  </g>

  <!-- Glowing Ancient Document / Magnifying Mystery Icon -->
  <g transform="translate(240, 140)">
    <circle cx="0" cy="0" r="30" stroke="#f59e0b" stroke-width="3" fill="#451a03" fill-opacity="0.6"/>
    <circle cx="0" cy="0" r="24" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 2" fill="none"/>
    <line x1="21" y1="21" x2="42" y2="42" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
    <!-- Ancient Eye / Mystery Hieroglyph -->
    <path d="M -14 0 Q 0 -12 14 0 Q 0 12 -14 0" stroke="#fef08a" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
  </g>

  <!-- Badge -->
  <g transform="translate(15, 202)">
    <rect width="215" height="26" rx="6" fill="#831843" fill-opacity="0.9"/>
    <text x="10" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">
      ★ DARK MYSTERY & NOIR
    </text>
  </g>
</svg>
