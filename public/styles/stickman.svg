<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Background pattern -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#334155" opacity="0.4"/>
    </pattern>
    <linearGradient id="stickmanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="240" fill="#0f172a" />
  <rect width="400" height="240" fill="url(#dotGrid)" />

  <!-- Doodles / Math / Science diagrams -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.7">
    <!-- Curved attention arrows -->
    <path d="M 60 70 Q 100 40 140 60" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
    <path d="M 280 60 Q 320 80 340 120" stroke-dasharray="4 3"/>
    <!-- DNA doodle -->
    <path d="M 330 40 Q 345 55 330 70 Q 315 85 330 100" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 340 40 Q 325 55 340 70 Q 355 85 340 100" stroke="#f43f5e" stroke-width="2"/>
    <line x1="324" y1="55" x2="346" y2="55" stroke="#cbd5e1"/>
    <line x1="324" y1="85" x2="346" y2="85" stroke="#cbd5e1"/>
    <!-- Formulas -->
    <text x="50" y="50" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="bold">E = mc²</text>
    <text x="60" y="180" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold">99% DON'T KNOW!</text>
    <!-- Question marks & Exclamation -->
    <text x="145" y="55" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="900">?</text>
    <text x="260" y="65" fill="#f59e0b" font-family="sans-serif" font-size="24" font-weight="900">!</text>
  </g>

  <!-- Glowing Idea Lightbulb -->
  <g transform="translate(200, 48)">
    <circle cx="0" cy="0" r="16" fill="#fbbf24" opacity="0.25" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="10" fill="#fef08a"/>
    <!-- Bulb rays -->
    <line x1="0" y1="-16" x2="0" y2="-22" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="-10" x2="20" y2="-15" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-14" y1="-10" x2="-20" y2="-15" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-4" y="9" width="8" height="5" rx="1" fill="#94a3b8"/>
  </g>

  <!-- The Stickman Character (Ashish FN Signature) -->
  <g transform="translate(195, 135)" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Head -->
    <circle cx="0" cy="-42" r="18" fill="#ffffff"/>
    
    <!-- Face: Expressive Curious Eyes & Smile -->
    <ellipse cx="-6" cy="-44" rx="2.5" ry="4" fill="#0f172a" stroke="none"/>
    <ellipse cx="6" cy="-44" rx="2.5" ry="4" fill="#0f172a" stroke="none"/>
    <!-- Glasses -->
    <circle cx="-6" cy="-44" r="6" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
    <circle cx="6" cy="-44" r="6" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
    <line x1="0" y1="-44" x2="0" y2="-44" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Expressive smile -->
    <path d="M -7 -36 Q 0 -31 7 -36" stroke="#0f172a" stroke-width="2.5" fill="none"/>

    <!-- Spine/Body -->
    <line x1="0" y1="-24" x2="0" y2="22"/>

    <!-- Right Arm pointing eagerly upward at the idea lightbulb -->
    <path d="M 0 -12 L 22 -28 L 10 -55" stroke="#38bdf8" stroke-width="4"/>

    <!-- Left Arm holding a magnifying glass -->
    <path d="M 0 -12 L -22 -4 L -38 -20"/>
    
    <!-- Legs in energetic presentation stance -->
    <path d="M 0 22 L -18 65 L -30 66"/>
    <path d="M 0 22 L 18 65 L 30 66"/>
  </g>

  <!-- Magnifying glass overlay in stickman's hand -->
  <g transform="translate(156, 114)">
    <circle cx="0" cy="0" r="12" stroke="#f59e0b" stroke-width="3" fill="#38bdf8" fill-opacity="0.25"/>
    <line x1="8" y1="8" x2="18" y2="18" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <text x="-5" y="4" fill="#ffffff" font-size="10" font-family="monospace" font-weight="bold">AI</text>
  </g>

  <!-- Style Badge Pill -->
  <g transform="translate(15, 202)">
    <rect width="210" height="26" rx="6" fill="#0284c7" fill-opacity="0.9"/>
    <text x="10" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">
      ★ 2D STICKMAN EXPLAINER
    </text>
  </g>
  <g transform="translate(235, 202)">
    <rect width="150" height="26" rx="6" fill="#f59e0b" fill-opacity="0.9"/>
    <text x="8" y="17" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="800">
      ASHISH FN SIGNATURE
    </text>
  </g>
</svg>
