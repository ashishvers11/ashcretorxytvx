<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="microBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c16"/>
    </linearGradient>
    <filter id="hologramGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#microBg)"/>

  <!-- Isometric Grid Floor -->
  <g stroke="#10b981" stroke-width="0.8" opacity="0.3" fill="none">
    <path d="M 0 160 L 200 240 L 400 160"/>
    <path d="M 0 120 L 200 200 L 400 120"/>
    <path d="M 0 80 L 200 160 L 400 80"/>
    <line x1="50" y1="100" x2="250" y2="180"/>
    <line x1="150" y1="60" x2="350" y2="140"/>
    <line x1="250" y1="100" x2="50" y2="180"/>
    <line x1="350" y1="60" x2="150" y2="140"/>
  </g>

  <!-- 3D Isometric Cutaway Block (Cellular / Botanical) -->
  <g transform="translate(200, 110)">
    <!-- Top Face -->
    <polygon points="0,-50 90,-10 0,30 -90,-10" fill="#059669" stroke="#34d399" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="90,-10 90,60 0,100 0,30" fill="#047857" stroke="#10b981" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-90,-10 -90,60 0,100 0,30" fill="#065f46" stroke="#10b981" stroke-width="2"/>

    <!-- Glowing internal cellular structures / Spheres -->
    <circle cx="0" cy="-10" r="14" fill="#38bdf8" opacity="0.9" filter="url(#hologramGlow)"/>
    <circle cx="-35" cy="0" r="9" fill="#a7f3d0" opacity="0.8"/>
    <circle cx="35" cy="5" r="10" fill="#facc15" opacity="0.85"/>

    <!-- Cross section layers -->
    <line x1="-90" y1="15" x2="0" y2="55" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="0" y1="55" x2="90" y2="15" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Laser Pointer / Measurement Callout -->
    <line x1="0" y1="-10" x2="45" y2="-60" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="45" y1="-60" x2="95" y2="-60" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="95" cy="-60" r="2.5" fill="#38bdf8"/>
    <text x="50" y="-66" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="bold">CELL CORE 0.5µm</text>
  </g>

  <!-- Badge -->
  <g transform="translate(15, 202)">
    <rect width="250" height="26" rx="6" fill="#047857" fill-opacity="0.9"/>
    <text x="10" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">
      ★ ISOMETRIC SCIENTIFIC MICRO-WORLD
    </text>
  </g>
</svg>
