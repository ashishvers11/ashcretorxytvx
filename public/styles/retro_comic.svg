<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <pattern id="halftoneDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.5" fill="#dc2626" opacity="0.35"/>
    </pattern>
    <linearGradient id="comicYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <!-- Yellow pop background with halftone dots -->
  <rect width="400" height="240" fill="url(#comicYellow)"/>
  <rect width="400" height="240" fill="url(#halftoneDots)"/>

  <!-- Dynamic Black Action Speed Lines -->
  <g stroke="#000000" stroke-width="2.5" opacity="0.75">
    <line x1="0" y1="0" x2="140" y2="80"/>
    <line x1="0" y1="60" x2="130" y2="90"/>
    <line x1="400" y1="0" x2="260" y2="80"/>
    <line x1="400" y1="70" x2="270" y2="95"/>
    <line x1="0" y1="240" x2="130" y2="160"/>
    <line x1="400" y1="240" x2="270" y2="160"/>
  </g>

  <!-- Explosive Action Starburst -->
  <polygon points="200,30 220,70 265,55 245,95 285,115 240,135 260,175 215,160 195,200 180,160 135,175 155,135 110,115 150,95 130,55 175,70" fill="#dc2626" stroke="#000000" stroke-width="4"/>

  <!-- Comic Speech Bubble / POP Callout -->
  <g transform="translate(200, 115)">
    <ellipse cx="0" cy="0" rx="48" ry="28" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <polygon points="-10,24 -24,40 5,26" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <text x="0" y="8" fill="#000000" font-family="Impact, sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="1">
      FACT!
    </text>
  </g>

  <!-- Comic Panel Borders -->
  <rect x="6" y="6" width="388" height="228" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Badge -->
  <g transform="translate(15, 202)">
    <rect width="250" height="26" rx="6" fill="#000000" fill-opacity="0.9"/>
    <text x="10" y="17" fill="#facc15" font-family="Impact, sans-serif" font-size="12" letter-spacing="0.5">
      ★ RETRO COMIC & 2.5D POP-ART
    </text>
  </g>
</svg>
