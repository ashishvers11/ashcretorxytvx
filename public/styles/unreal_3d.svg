<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#090a1a"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="earthGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>
    <radialGradient id="sunFlare" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fdba74" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="ue5Glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#spaceBg)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="45" cy="35" r="1" opacity="0.8"/>
    <circle cx="120" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="280" cy="40" r="1.2" opacity="0.9"/>
    <circle cx="360" cy="75" r="1" opacity="0.5"/>
    <circle cx="90" cy="180" r="0.8" opacity="0.7"/>
    <circle cx="340" cy="190" r="1.5" opacity="0.8"/>
    <circle cx="220" cy="25" r="2" opacity="0.9"/>
  </g>

  <!-- Photorealistic Earth Sphere -->
  <g transform="translate(200, 150)">
    <!-- Atmospheric halo -->
    <circle cx="0" cy="0" r="105" fill="#38bdf8" opacity="0.18" filter="url(#ue5Glow)"/>
    <circle cx="0" cy="0" r="98" fill="url(#earthGlow)"/>

    <!-- Continents / Cloud swirling bands -->
    <path d="M -50 -30 Q -20 -60 30 -40 Q 60 -10 30 20 Q -10 40 -50 20 Z" fill="#22c55e" opacity="0.75"/>
    <path d="M -70 10 Q -40 -10 -20 20 Q -10 60 -40 70 Z" fill="#15803d" opacity="0.7"/>
    <!-- Swirling Photorealistic Clouds -->
    <path d="M -90 -20 Q -40 -50 20 -30 Q 70 -40 85 -10" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.55" filter="url(#ue5Glow)"/>
    <path d="M -80 30 Q -10 10 50 35 Q 80 50 90 20" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Shadow Terminus (Day/Night line) -->
    <path d="M 0 -98 A 98 98 0 0 1 0 98 A 50 98 0 0 0 0 -98" fill="#020617" opacity="0.75"/>
  </g>

  <!-- Sun Lens Flare -->
  <circle cx="70" cy="55" r="65" fill="url(#sunFlare)"/>
  <line x1="10" y1="20" x2="160" y2="105" stroke="#fef08a" stroke-width="1" opacity="0.5"/>

  <!-- Badge -->
  <g transform="translate(15, 202)">
    <rect width="235" height="26" rx="6" fill="#4338ca" fill-opacity="0.9"/>
    <text x="10" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">
      ★ CINEMATIC 3D (UNREAL ENGINE 5)
    </text>
  </g>
</svg>
