<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <radialGradient id="pixarWarmBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    <radialGradient id="characterSkin" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#pixarWarmBg)"/>

  <!-- Warm Floating Glow Orbs (Pixar whimsy) -->
  <circle cx="80" cy="70" r="18" fill="#fde047" opacity="0.3" filter="url(#softGlow)"/>
  <circle cx="320" cy="80" r="24" fill="#67e8f9" opacity="0.25" filter="url(#softGlow)"/>
  <circle cx="280" cy="180" r="14" fill="#f43f5e" opacity="0.3"/>

  <!-- Stylized 3D Animated Character Head & Torso -->
  <g transform="translate(200, 120)">
    <!-- Shoulders / Jacket -->
    <path d="M -55 70 C -50 35 -20 28 0 28 C 20 28 50 35 55 70 Z" fill="#0284c7"/>
    <!-- Yellow Shirt Collar -->
    <polygon points="-12,28 12,28 0,42" fill="#facc15"/>

    <!-- Head / Round Cheeks -->
    <ellipse cx="0" cy="-15" rx="36" ry="40" fill="url(#characterSkin)"/>
    <!-- Cute Ears -->
    <circle cx="-36" cy="-12" r="9" fill="#fed7aa"/>
    <circle cx="36" cy="-12" r="9" fill="#fed7aa"/>

    <!-- Big Expressive Pixar Eyes -->
    <ellipse cx="-13" cy="-18" rx="10" ry="12" fill="#ffffff"/>
    <ellipse cx="13" cy="-18" rx="10" ry="12" fill="#ffffff"/>
    <!-- Iris & Pupils with cute specular sparkle -->
    <circle cx="-11" cy="-17" r="6" fill="#0284c7"/>
    <circle cx="11" cy="-17" r="6" fill="#0284c7"/>
    <circle cx="-13" cy="-20" r="2.5" fill="#ffffff"/>
    <circle cx="9" cy="-20" r="2.5" fill="#ffffff"/>

    <!-- Big Happy Smile -->
    <path d="M -15 -2 Q 0 12 15 -2" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round" fill="#be123c"/>
    <path d="M -9 0 Q 0 5 9 0" fill="#ffffff"/>

    <!-- Stylized Pixar Hair Tuft -->
    <path d="M -25 -50 C -15 -70 20 -70 30 -48 C 35 -35 25 -42 20 -40 C 10 -55 -15 -52 -25 -50 Z" fill="#451a03"/>

    <!-- Glowing science test tube held in hand -->
    <g transform="translate(42, 25)">
      <rect x="0" y="0" width="10" height="30" rx="5" fill="#a5f3fc" opacity="0.6"/>
      <rect x="1" y="10" width="8" height="19" rx="4" fill="#38bdf8" filter="url(#softGlow)"/>
      <circle cx="5" cy="18" r="1.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Badge -->
  <g transform="translate(15, 202)">
    <rect width="215" height="26" rx="6" fill="#c2410c" fill-opacity="0.9"/>
    <text x="10" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">
      ★ VIBRANT 3D PIXAR ANIMATION
    </text>
  </g>
</svg>
